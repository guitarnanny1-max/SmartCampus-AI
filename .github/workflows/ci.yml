name: SmartCampus AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: smartcampus_admin
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: smartcampus_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Run Schema Check
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://smartcampus_admin:securepassword123@localhost:5432/smartcampus_prod?schema=public

      - name: Build Production Application
        run: npm run build
        env:
          DATABASE_URL: postgresql://smartcampus_admin:securepassword123@localhost:5432/smartcampus_prod?schema=public
