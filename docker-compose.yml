version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartcampus-saas-os:latest
    container_name: smartcampus_production_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:secure_password@postgres:5432/smartcampus_db
      - REDIS_URL=redis://redis:6379
      - STRIPE_SECRET_KEY=sk_live_sample
      - RAZORPAY_KEY_ID=rzp_live_sample
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: smartcampus_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=smartcampus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartcampus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
